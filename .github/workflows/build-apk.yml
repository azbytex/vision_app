name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Sanitize gradlew (dos2unix, strip BOM, remove malformed quoted JVM options, set executable)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y dos2unix
          # Normalize line endings
          dos2unix gradlew
          # Remove BOM if present
          sed -i '1s/^\xEF\xBB\xBF//' gradlew
          # Ensure no stray CR characters remain
          sed -i 's/\r$//' gradlew
          # Remove literal double-quotes that wrap JVM options like "-Xmx64m"
          # This replaces occurrences like "\"-Xmx64m\"" -> -Xmx64m
          sed -i -E 's/"(-X[Mm][^"]*)"/\1/g' gradlew
          # As a fallback, remove any stray double quotes in the file (only if needed)
          # sed -i 's/"//g' gradlew
          chmod +x gradlew

      - name: Build Debug APK
        shell: bash
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionFrame_AI_Camera.apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
